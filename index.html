<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Discovery</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>Music Discovery</h1><button id="settingsBtn">接続設定</button></header><section id="setup"><h2>非公開データへの接続</h2><p>GitHub Fine-grained token（Music-Discovery-Data の Contents: Read and write）を入力。トークンはブラウザのセッション内に保持します。</p><label>Repository <input id="repo" value="Nimrodx0/Music-Discovery-Data"></label><label>Token <input id="token" type="password" autocomplete="off"></label><button id="connect">接続</button><button id="disconnect">解除</button><p id="connection"></p></section><section class="stats"><div>全曲 <b id="total">0</b></div><div>未評価 <b id="pending">0</b></div><div>評価済み <b id="rated">0</b></div></section><nav><button data-filter="pending">未評価</button><button data-filter="all">すべて</button><button data-filter="rated">評価済み</button></nav><input id="search" placeholder="曲名・アーティストで検索"><section id="songs"></section><details><summary>推薦履歴をJSONで追加</summary><textarea id="importJson" rows="4"></textarea><button id="importBtn">追加</button><p id="importStatus"></p></details></main><dialog id="editor"><form id="feedbackForm"><h2 id="editingTitle"></h2><p id="editingArtist"></p><label>総合評価（必須）<select id="liking" required><option value="">選択</option><option>とても好き</option><option>好き</option><option>どちらでもない</option><option>あまり好きではない</option><option>好きではない</option><option>未聴・判断できない</option></select></label><label>再聴意欲<select id="replay"><option value="">未評価</option><option>ぜひ聴きたい</option><option>機会があれば</option><option>特に聴きたいとは思わない</option><option>もう聴きたくない</option><option>判断できない</option></select></label><label>感情的な響き（1〜5）<select id="emotion"><option value="">未評価</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>知的・音楽的な面白さ（1〜5）<select id="interest"><option value="">未評価</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><fieldset><legend>魅力を感じた要素</legend><div id="aspects"></div></fieldset><label>自由記述<textarea id="note" rows="3"></textarea></label><p id="saveStatus"></p><button type="submit" id="save">評価を保存</button><button type="button" id="closeEditor">閉じる</button></form></dialog><script src="app.js"></script></body></html>
