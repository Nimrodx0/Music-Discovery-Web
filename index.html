<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e121a"><title>Music Discovery</title><link rel="stylesheet" href="style.css?v=4"></head>
<body><main class="shell">
<header class="top"><div class="brand"><span class="brandmark">◉</span><div><div class="eyebrow">PERSONAL MUSIC JOURNAL</div><h1>Music Discovery</h1></div></div><button id="settingsBtn" class="iconbtn" aria-label="設定メニューを開く" aria-expanded="false" aria-controls="settingsPanel">☰</button></header>
<section id="settingsPanel" class="settings" hidden><div class="section-heading"><h2>接続設定</h2><span class="subtle">通常は操作不要</span></div><p class="hint">非公開GitHubリポジトリのデータを読み書きします。トークンはブラウザのセッション中だけ保持します。</p><label>リポジトリ<input id="repo" value="Nimrodx0/Music-Discovery-Data" autocomplete="off"></label><label>GitHubトークン<input id="token" type="password" placeholder="変更する場合のみ入力" autocomplete="off"></label><div class="actionrow"><button id="connect" class="primary">接続・再読み込み</button><button id="disconnect" class="secondary">接続解除</button></div><p id="connection" role="status" class="hint"></p><details class="import"><summary>JSONデータを追加</summary><textarea id="importJson" rows="4" placeholder="推薦履歴のJSON配列"></textarea><button id="importBtn" class="secondary">重複を除いて追加</button><p id="importStatus" role="status"></p></details></section>

<section class="stats" aria-label="推薦履歴の集計"><div><span>推薦曲</span><strong id="total">0</strong></div><div><span>未評価</span><strong id="pending">0</strong></div><div><span>評価済み</span><strong id="rated">0</strong></div></section>
<section class="library"><div class="section-heading"><div><p class="eyebrow">LIBRARY</p><h2>推薦履歴</h2></div><button id="refresh" class="refresh" title="最新データを取得">↻ 更新</button></div><div class="controls"><nav class="tabs" aria-label="表示する曲"><button data-filter="pending" class="active">未評価</button><button data-filter="all">すべて</button><button data-filter="rated">評価済み</button></nav><label class="search"><span aria-hidden="true">⌕</span><input id="search" placeholder="曲名・アーティストで検索" aria-label="曲名・アーティストで検索"></label></div><div id="songs" class="songs"><p class="empty">接続すると推薦履歴を表示します。</p></div></section>
<footer>Music Discovery · Private listening journal</footer>
</main>
<dialog id="editor"><form id="feedbackForm"><div class="dialoghead"><div><p class="eyebrow">LISTENING NOTES</p><h2 id="editingTitle"></h2><p id="editingArtist" class="subtle"></p></div><button type="button" id="closeEditor" class="iconbtn" aria-label="閉じる">✕</button></div><label>総合評価 <span class="required">必須</span><select id="liking" required><option value="">選択してください</option><option>とても好き</option><option>好き</option><option>どちらでもない</option><option>あまり好きではない</option><option>好きではない</option><option>未聴・判断できない</option></select></label><label>もう一度聴きたい？<select id="replay"><option value="">未評価</option><option>ぜひ聴きたい</option><option>機会があれば</option><option>特に聴きたいとは思わない</option><option>もう聴きたくない</option><option>判断できない</option></select></label><div class="ratinggrid"><label>感情的な響き<select id="emotion"><option value="">未評価</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>知的・音楽的な面白さ<select id="interest"><option value="">未評価</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label></div><fieldset><legend>魅力を感じた要素 <span class="subtle">複数選択可</span></legend><div id="aspects" class="checks"></div></fieldset><label>メモ <span class="subtle">任意</span><textarea id="note" rows="3" placeholder="好きだったところ、違和感、気づいたこと…"></textarea></label><p id="saveStatus" role="status"></p><button type="submit" id="save" class="primary full">フィードバックを保存</button></form></dialog><script src="app.js?v=4"></script></body></html>
